# Local development services. Start with `docker compose up -d`, then `npm run setup`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: readyhire
      POSTGRES_PASSWORD: readyhire
      POSTGRES_DB: readyhire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readyhire"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
